aid: openbmc
name: OpenBMC
description: >-
  OpenBMC is a Linux Foundation project producing an open source implementation
  of baseboard management controller firmware. Founded by Microsoft, Intel, IBM,
  Google, and Facebook, it provides a Linux-based firmware stack for managing and
  monitoring server hardware systems.
